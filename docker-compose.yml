services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: massif
      POSTGRES_PASSWORD: massif
      POSTGRES_DB: massif
    ports:
      - "5433:5432"
    volumes:
      - massif_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massif"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  massif_pgdata:
