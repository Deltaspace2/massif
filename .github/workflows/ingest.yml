# Scheduled ingest.
#
# OFF BY DEFAULT, and deliberately. This workflow needs a DATABASE_URL secret
# pointing at a deployed Postgres, and there isn't one yet — the database lives
# on a laptop. Left on a */30 cron against a secret that does not exist, it
# failed forty-eight times a day and emailed every time, which is not
# monitoring. It is training yourself to ignore the emails that will matter.
#
# TO TURN ON, once there is a database:
#   1. Settings > Secrets and variables > Actions > Secrets:   DATABASE_URL
#   2. Same page, Variables tab:                               USER_AGENT
#   3. Same page, Variables tab:                               INGEST_ENABLED = true
#
# Nothing here changes. The switch is a repository variable so enabling it is
# not a commit, and so the reason it is off stays written down.

name: ingest

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes, revised 7 Sep 2026 against measurement.
    #
    # This said "hourly, not half-hourly" on the reasoning that scheduled runs
    # are queued rather than guaranteed, so a tight cron buys unreliability
    # rather than freshness. The queuing is real; the conclusion was not. On an
    # hourly schedule GitHub actually delivered runs at 17:27, 19:54, 21:54,
    # 23:25, 02:33, 07:49 and 13:54 — gaps of 1.5 to 6 hours. The ceiling this
    # sets was the binding constraint, not the per-source cadence underneath
    # it, and mbnr-live's 30-minute feed sat 224 minutes stale with eight lifts
    # badged UNCHECKED.
    #
    # More scheduled firings mean more delivered runs; GitHub drops some, not
    # all. It costs nothing to ask: this repository is public, so Actions
    # minutes are unlimited, and a run takes two to three of them.
    #
    # tests/test_ingest_schedule.py holds the invariant this got wrong — no
    # active source may declare a cadence shorter than the cron can attempt,
    # because `_unchecked` fires at two missed intervals and a badge that can
    # never clear is one nobody reads.
    - cron: "*/30 * * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    # workflow_dispatch always runs, so the switch can be tested by hand before
    # anyone trusts the schedule.
    if: github.event_name == 'workflow_dispatch' || vars.INGEST_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the configuration before doing anything
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: ${{ vars.USER_AGENT }}
        run: |
          # Fail with a sentence rather than a stack trace forty minutes later.
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Ingest has nothing" \
                 "to write to. See the comment at the top of this workflow."
            exit 1
          fi
          if [ -z "$USER_AGENT" ]; then
            echo "::error::USER_AGENT variable is not set. This project does" \
                 "not fetch anyone's site without identifying itself and" \
                 "giving them a contact address."
            exit 1
          fi

      - name: Install
        working-directory: backend
        run: pip install -e .

      - name: Migrate
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m massif.scripts.migrate

      - name: Run ingest
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USER_AGENT: ${{ vars.USER_AGENT }}
        run: python -m massif.scripts.run_ingest

      # Facts are not statements and do not go through the scraper registry, so
      # run_ingest never touched them. Until this step existed, both directory
      # importers were things a human ran by hand — a deployed site would have
      # frozen its hut facts on launch day. Each carries a weekly cadence in the
      # data, so this does nothing 167 hours out of 168.
      - name: Refresh directory facts
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: ${{ vars.USER_AGENT }}
        run: python -m massif.scripts.run_facts

      # Facts and statements both feed the status cache, and the facts step can
      # move a hut's altitude, which the matchers read. Cheap, and it keeps the
      # cache honest after anything that edited rows out of band.
      - name: Recompute status
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m massif.scripts.recompute

      - name: Review queue
        if: always()
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Names that did not resolve are the highest-leverage maintenance task
        # on this project, and the run log is free observability for them.
        run: python -m massif.scripts.review_queue || true
