name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: massif
          POSTGRES_PASSWORD: massif
          POSTGRES_DB: massif
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U massif"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check massif
      - name: Migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://massif:massif@localhost:5433/massif
        run: python -m massif.scripts.migrate
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://massif:massif@localhost:5433/massif
        run: pytest -q
