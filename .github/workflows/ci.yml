name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: massif
          POSTGRES_PASSWORD: massif
          POSTGRES_DB: massif
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U massif"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        # tests/ is linted too now. It was excluded because six pre-existing
        # findings would have made this red on arrival; those are fixed, and
        # the captured-HTML fixtures carry a file-level noqa with the reason.
        run: ruff check massif tests
      - name: Migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://massif:massif@localhost:5433/massif
        run: python -m massif.scripts.migrate
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://massif:massif@localhost:5433/massif
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        # No MASSIF_API here on purpose. The build must survive an unreachable
        # backend — it statically generates the front page, and the failure
        # path it renders is shipped copy, so it is worth exercising. The fonts
        # are in the repo rather than fetched from Google, so this needs no
        # egress either.
        run: npm run build
