- slug: petite-aiguille-verte
  feature_type: route
  name_default: Petite Aiguille Verte — normal route
  aliases:
    - Petite Verte
    - Petite Aiguille Verte
  # Added 8 Sep 2026 so rule 8's altitude guard can run at all: it is
  # `if feature.alt_max and elevation`, so a null silently skipped the
  # check and accepted a match on name score alone.
  # Petite Aiguille Verte, OSM node/4357285689. NOT the Aiguille Verte
  # (4121 m) — the two are 600 m apart in altitude and one alias apart
  # in name, which is exactly the confusion rule 8 exists for.
  alt_max: 3512
  # Anchored on the Aiguille des Grands Montets, NOT on the lift.
  #
  # The obvious start is the Grands Montets top station, and the obvious fix
  # was to add that lift. It does not exist. OSM way/1447084429 carries
  # `aerialway=construction`, `construction:aerialway=gondola` and a note
  # citing Compagnie du Mont-Blanc's own project page: the second section
  # opens in 2027. Our `grands-montets` feature is that cable car, which is
  # why it has neither geometry nor a status.
  #
  # The route is climbed from the Aiguille des Grands Montets whether or not
  # a lift takes you there, and that summit IS a position we hold — OSM
  # node/2401280720, 3296 m, about 90 m from the unbuilt station. So the line
  # is drawn from the mountain rather than from the machine.
  schematic_via:
    - osm:node/2401280720      # Aiguille des Grands Montets, 3296 m
    - osm:node/4357285689      # Petite Aiguille Verte, 3512 m
  country: FR
  # camptocamp 53783 — 3512 m; their Slovenian locale of the normal route. Pinned by hand: their search ranks
  # strings, and matching by name put our Goûter route on the
  # Kungsleden in Sweden.
  external_ids: {camptocamp_route: 53783, camptocamp_title: "po normalki (SZ greben)"}

