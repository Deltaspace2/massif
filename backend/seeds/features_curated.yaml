- slug: rifugio-elisabetta
  feature_type: hut
  name_default: Rifugio Elisabetta
  # OSM carries the full dedication. Our shorter forms matched none of its
  # keys, so the hut had no geometry and could not be drawn.
  aliases: [Elisabetta, Elisabetta Soldini, Rifugio Elisabetta Soldini,
            Rifugio Elisabetta Soldini Montanaro]
  country: IT

- slug: abri-vallot
  feature_type: hut
  name_default: Abri Vallot
  aliases: [Vallot, Vallot hut, Refuge Vallot, Cabane Vallot]
  alt_max: 4362
  country: FR
  # Reader-facing, because it is now rendered above the directory facts.
  # refuges.info lists 12 places here, which is true and reads as a bunkroom;
  # this is a shelter of last resort on the summit ridge. Never let the page
  # present it as somewhere to plan to sleep.
  notes: >-
    An emergency shelter, not accommodation: no warden, no booking, no
    supplies. The places below are refuge-of-last-resort space, not beds.
  # "Refuge Vallot", 4362 m — the same metre as ours. Not matched by name
  # because abri and refuge are a real distinction in French and folding them
  # together is what put the wrong Conscrits hut on this site for one commit.
  # Their "Observatoire Vallot" (4358 m) is the building next door, and is
  # close enough in both name and height to be picked by accident.
  external_ids: {refuges-info: 345}

- slug: bivacco-della-fourche
  feature_type: hut
  name_default: Bivacco della Fourche
  # The hut has two unrelated names: its dedication and its location. We chose
  # the location; OSM and refuges.info both use the dedication, which scores
  # 54.5 against ours — unmatchable by name in either direction, and it read as
  # "nobody has this hut" when both do. The alias earns its OSM geometry; the
  # id is on the OSM node as ref:refuges.info, so the two agree independently.
  aliases: [Fourche, Bivouac de la Fourche, Fourche bivouac,
            Bivacco Alberico e Borgna, Bivouac Alberico Borgna,
            Trident-Biwak Col de la Fourche]
  external_ids: {refuges-info: 380}
  country: IT

