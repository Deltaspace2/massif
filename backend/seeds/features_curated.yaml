- slug: refuge-torino
  feature_type: hut
  name_default: Rifugio Torino
  aliases: [Torino hut, Refuge Torino, Rifugio Torino Nuovo]
  alt_max: 3375
  country: IT
  # Pinned, not matched. refuges.info carries both "Refuge Torino (nouveau)"
  # and "Refuge Torino (ancien)", and the old one sits at 3329 m — 46 m from
  # ours, well inside the 120 m tolerance. Name scoring alone would leave the
  # decoy word list as the only thing between us and publishing a replaced
  # refuge's beds and phone number as if they were this one's.
  external_ids: {refuges-info: 376}

- slug: rifugio-gonella
  feature_type: hut
  name_default: Rifugio Gonella
  # They publish it as "Refuge Francesco Gonella". The given name holds the
  # score at 85.5 against a floor of 88 no matter how the generic is folded,
  # while the altitude is 1 m from ours. Pinned rather than lowering a floor
  # that protects every other hut.
  external_ids: {refuges-info: 365}
  aliases: [Gonella, Refuge Gonella]
  alt_max: 3071
  country: IT

