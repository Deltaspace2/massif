# Hand-curated features for the Mont Blanc massif.
#
# WHAT LIVES HERE: things OSM handles badly or not at all — routes, named
# hazard sections, itineraries — plus the alias lists for everything.
#
# WHAT DOESN'T: coordinates for huts, lifts, peaks and glaciers. Those come
# from OSM via scripts/fetch_osm_candidates.py, matched into these entries by
# alias. Inventing coordinates by hand is how you end up with a map that is
# confidently wrong.
#
# THE ALIASES ARE THE POINT. Four sources in three languages name the same
# route four different ways. Every alias you add here is a mention the
# resolver will match instead of dumping in the review queue. Add to these
# freely — it is the single highest-leverage maintenance task on the project.
#
# geom_verified stays false until a human has checked the geometry against IGN.

# --------------------------------------------------------------- routes ----

- slug: gouter-route
  feature_type: route
  name_default: Goûter Route
  names:
    fr: Voie du Goûter
    it: Via normale francese
    en: Goûter Route
    de: Goûter-Route
  aliases:
    - Voie Royale
    - Voie normale française
    - Goûter
    - Gouter
    - Gouter route
    - Arête du Goûter
    - Via del Gouter
    - Normalweg
  alt_min: 1653
  alt_max: 4808
  # No line exists for this anywhere we can reach. camptocamp splits the
  # route (their "Accès au refuge du Goûter" stops at 3840 m) and OSM's only
  # matches are decoys: 'Impasse du Gouter' is a residential street in the
  # valley, and the three "Goûter" ways are refuge BUILDING outlines.
  #
  # So it is drawn through waypoints we already hold, and every one of them is
  # a real surveyed position rather than a guess: four of our own features and
  # two OSM peak nodes. It follows the actual line of the route — up from the
  # tramway terminus, past Tête Rousse, over the Aiguille du Goûter (the Grand
  # Couloir is crossed on that leg), the Goûter hut, the Dôme, the summit.
  #
  # It is a SCHEMATIC and is written geom_source: schematic, which the map
  # draws dashed. It is not a GPX track and must never be presented as one.
  schematic_via:
    - refuge-du-nid-d-aigle
    - refuge-tete-rousse
    - osm:node/1438494348      # Aiguille du Goûter, 3863 m
    - refuge-du-gouter
    - osm:node/3559071817      # Dôme du Goûter, 4304 m
    - osm:node/281399025       # Mont Blanc, 4807 m
  country: FR

- slug: grand-couloir
  feature_type: couloir
  parent: gouter-route
  name_default: Grand Couloir du Goûter
  names:
    fr: Grand Couloir du Goûter
    it: Grand Couloir
    en: Grand Couloir
  aliases:
    - Grand Couloir
    - Couloir du Goûter
    - Couloir de la Mort
    - Death Couloir
    - Corridoio della Morte
    - le Grand Couloir
  alt_min: 3200
  alt_max: 3400
  # NO SCHEMATIC, and the reason is worth keeping.
  #
  # Tried on 8 Sep 2026 as Tête Rousse -> Aiguille du Goûter, on the argument
  # that the couloir is a gully cut by that leg. build_schematic_routes
  # refused it: those waypoints top out at 3863 m and this couloir is
  # 3200-3400 m, so the line would have been 463 m too high — drawn up the
  # slope ABOVE the crossing rather than at it.
  #
  # That is the altitude guard rejecting a line we drew ourselves, which is
  # exactly what it is for. The Grand Couloir crossing is a point on open
  # slope at about 3340 m and is not a feature we hold a position for, so
  # there is nothing honest to draw it through. It stays unmapped until
  # somebody has a real position for the crossing.
  country: FR
  notes: >
    The single most-searched feature on this map. Rockfall-exposed traverse on
    the Goûter route. Its own feature rather than a note on the parent route,
    because sources close and reopen it independently.

