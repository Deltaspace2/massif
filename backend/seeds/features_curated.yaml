- slug: tramway-du-mont-blanc
  feature_type: lift
  name_default: Tramway du Mont-Blanc
  aliases:
    - TMB
    - Tramway du Mont Blanc
    - Nid d'Aigle
    - Nid d'Aigle train
  alt_max: 2372
  # Tramway du Mont-Blanc, infrastructure rather than either direction's
  # service relation.
  #
  # A railway is many OSM ways; only the relation is the whole line.
  osm_line: relation/14626388
  country: FR
  notes: Access for the Goûter route. Its closure closes the normal approach.

# The valley's access railway, and the only way to reach Vallorcine and the
# Bérard/Buet approaches without a car. Carried because a closure on it closes
# an approach, which is this site's whole subject — not because anyone
# publishes its status yet. Neither operator feed covers it: see the
# ffcam/mbnr-openings recon note about `tramway-montblanc` for how easily that
# looks like a row we are dropping when it is not.
- slug: mont-blanc-express
  feature_type: lift
  name_default: Mont-Blanc Express
  names:
    fr: Mont-Blanc Express
    en: Mont Blanc Express
  aliases:
    - Ligne de Saint-Gervais-les-Bains-Le Fayet à Vallorcine (frontière)
    - Saint-Gervais — Vallorcine
    - Ligne 896000
    - Mont Blanc Express
    - TER Mont-Blanc Express
  # Ligne de Saint-Gervais-les-Bains-Le Fayet a Vallorcine — the INFRASTRUCTURE
  # relation, not one of the four directional service relations (SNCF
  # Voyageurs each way, TMR each way). A service is a timetable; the line is
  # the thing on the ground, and it is the thing a map should draw.
  #
  # The stored `osm` id way/25513422 is ONE segment of it, two points long,
  # which is why this railway rendered as a dot in the middle of the valley.
  #
  # A railway is many OSM ways; only the relation is the whole line.
  osm_line: relation/3448067
  country: FR
  notes: >
    SNCF Réseau line 896000, Saint-Gervais-les-Bains-Le Fayet to Vallorcine and
    the Swiss border, where it continues as the Martigny–Châtelard. Metre gauge
    and partly rack. No status source watches it.

# The whole Swiss presence inside the massif boundary. Champex-Lac, operated by
# Téléchampex — the Trient and Le Châble lifts are outside the ring. Two
# sections, modelled as one feature the way our other sectors are.
- slug: la-breya
  feature_type: lift
  name_default: Télésiège de La Breya
  names:
    fr: Télésiège de La Breya
    en: La Breya chairlift
  aliases:
    - La Breya
    - La Breya 1
    - La Breya 2
    - Breya
    - Champex-Lac
  country: CH
  notes: >
    Champex-Lac, the approach to the Cabane d'Orny and the Trient plateau. No
    status source watches it; the Swiss side has no publisher we have found.

- slug: grands-montets
  feature_type: lift
  name_default: Téléphérique des Grands Montets
  aliases: [Grands Montets, Grand Montets, Les Grands Montets]
  country: FR
  # NO GEOMETRY, AND THAT IS THE ANSWER RATHER THAN A GAP. Checked 9 Sep 2026.
  #
  # This is the second section, Lognan to the Aiguille des Grands Montets, and
  # it is not built. OSM way/1447084429 carries `aerialway=construction` with
  # `construction:aerialway=gondola`, a note describing a 3S with nine 24-seat
  # cabins, and a source_ref pointing at Compagnie du Mont-Blanc's own project
  # page. Their cited article says the second section opens in 2027.
  #
  # So there is a surveyed line for it, and drawing it would put a cable car on
  # the map that nobody can ride. Leave it unmapped until it opens; the day it
  # does, way/1447084429 is where its geometry comes from.
  #
  # This also explains the missing status: mbnr-live cannot report a lift that
  # is not running, so `unknown` here is correct and not a coverage hole.
  #
  # It was never in osm_candidates.yaml because that query asks for
  # `aerialway~cable_car|gondola` and this is tagged `construction` — the
  # FOURTH time "not in OSM" has meant "we never asked for that tag", after the
  # rack railways, the bivouacs and the Refuge du Montenvers.

- slug: brevent
  feature_type: lift
  name_default: Téléphérique du Brévent
  aliases: [Brévent, Brevent, Planpraz]
  country: FR

