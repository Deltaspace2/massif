# --- Swiss side -------------------------------------------------------------
# The massif does not stop at the French and Italian borders: the Trient and
# Saleina basins are the same mountains seen from Valais, and these are the
# huts on them. Country is CH from OSM admin boundaries, not from the "CAS" in
# a name — a Swiss Alpine Club hut is not the same claim as a hut in
# Switzerland.
#
# Deliberately NOT added, pending a call on where the massif ends: Refuge du
# Col de Balme (2191 m, sits on the border itself), Refuge des Petoudes
# (2169 m) and Refuge Le Peuty — all Swiss, all valley-floor or col rather
# than alpine, and all in seeds/osm_candidates.yaml if wanted.
#
# refuges.info will not cover most of these: its bbox stops at 7.05 E and
# Orny, Saleinaz and A Neuve are east of that. They will read "no directory
# entry" until the bbox is widened, which is one constant and one weekly pull.

