- slug: refuge-du-fioux
  alt_max: 1505
  note: >-
    refuges.info and an independent TMB walkers' guide both carry 1505 m in the
    entry title. tmb-guide.com is NOT the portal tmb-refuges reads — that is
    montourdumontblanc.com, refused here — but it is a guide to the same trail
    and may well have copied the portal, so this pair is the weakest of the
    seven. seechamonix.com rounds it to 1500 m.
  sources:
    - url: https://www.refuges.info/point/351/gite-d-etape/refuge-du-Fioux/
      value: 1505
      retrieved: 2026-09-07
    - url: https://www.tmb-guide.com/en/refuges/refuge-du-fioux-1505m-saint-gervais-france/
      value: 1505
      retrieved: 2026-09-07

