    - url: https://fr.wikipedia.org/wiki/T%C3%A9l%C3%A9cabine_de_la_Fl%C3%A9g%C3%A8re
      value: 1899
      retrieved: 2026-09-07
    - url: http://www.refuges.info/point/360/refuge-garde/aiguilles-rouges/refuge-de-la-flegere/
