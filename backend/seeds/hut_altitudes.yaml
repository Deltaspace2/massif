# Altitudes for the huts no source of ours could supply, read by hand.
#
# THE NINE. reports/2026-09-02.md measured that nine active huts carry no
# altitude in `features`, none in `feature_facts`, and — asked directly, one
# Overpass call, all nine objects returned — no `ele` in OpenStreetMap either.
# They are the huts `import_osm_huts` created, so the gap is upstream in OSM
# rather than in our importer, and no amount of re-running anything fills it.
# Without an altitude a hut is matched on its name alone, which is how
# `refuge-du-fioux`, `refuge-le-peuty` and `rifugio-bertone` sat refused by
# tmb-refuges with "our record carries no altitude to check it against".
#
# HOW THESE WERE READ. Every figure below was found through a web search on
# 7 Sep 2026 and every URL is recorded. The session that wrote this file could
# not open any of them: outbound egress was blocked to every host, so the
# numbers come from search-index titles and snippets rather than from the
# fetched page. That is weaker evidence than this project usually accepts, and
# it is the reason for the two-host rule in `massif/ingest/hut_altitudes.py`
# and for `--apply` not being the default. Anyone who CAN reach these pages
# should open them and confirm; `retrieved` says when each was last read.
#
# THE RULES, enforced in `massif/ingest/hut_altitudes.py`, not here:
#   * two independent hosts publishing the same figure, or the row is held
#   * the written value is one somebody published — never an average
#   * the TMB portal cannot supply an altitude, because tmb-refuges is the
#     thing that altitude then has to clear
#   * a disagreement wider than the matching tolerance holds the row instead
#     of picking a winner
#
# HELD ROWS STAY. A hut we could not source keeps its one reading and prints on
# every run, because "we found one source" is information and an absent line is
# not.

- slug: refuge-du-montenvers
  alt_max: 1913
  note: >-
    No refuges.info entry — it is tagged tourism=hotel in OSM and reads as one,
    which is also why our own OSM query missed it for so long. The operator and
    the valley's tourist office agree, and the site altitude (the railway
    terminus, a few steps away) is published as the same figure everywhere.
  sources:
    - url: https://en.refugedumontenvers.com/
      value: 1913
      retrieved: 2026-09-07
    - url: https://www.chamonix.com/hotels-de-charme/refuge-du-montenvers
      value: 1913
      retrieved: 2026-09-07

- slug: la-flegere
  alt_max: 1877
  note: >-
    The refuge's own site says 1877 m twice — the building and its terrace —
    and the lift page for the station it stands beside says the same. The
    refuges.info entry's 1807 m looks like 1877 with two digits swapped; it is
    kept below because it is what that source will hand `hut_facts`, and at
    70 m it still clears the 120 m screen rather than blocking the match. The
    gondola article's 1899 m is the arrival station, not the refuge.
  sources:
