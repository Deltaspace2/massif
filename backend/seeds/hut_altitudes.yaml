- slug: cabane-du-lac-des-vesses
  alt_max: null
  held: >-
    One source in four coats. refuge.camp, outtrip.fr, dorsdehors.com and
    altituderando all carry 2315 m and all republish refuges.info, so counting
    them is counting one figure four times. The only genuinely separate number
    found is 2327 m for the LAKE (OSM, via mapcarta), which is a lake and not a
    hut. An Italian shelter with no operator and no institutional page; the
    Valle d'Aosta cadastre or a fetched camptocamp waypoint is the next place
    to look.
  sources:
    - url: https://www.refuges.info/point/8467/cabane-non-gardee/cabane-du-lac-des-Vesses/
      value: 2315
      retrieved: 2026-09-07

- slug: cabane-de-la-tour-rouge
  alt_max: null
  held: >-
    Two problems, either of which is enough. Only refuges.info publishes a
    figure this search could attribute to a page — 2822 m — and that entry's
    own URL calls it the ANCIEN bivouac, while the shelter standing there was
    rebuilt on the same ledge in July 2021. A rebuilt hut and its predecessor
    at one altitude is the friendliest version of the Ancien-refuge-du-Goûter
    problem, and it is still the shape of it. Secondary write-ups say "about
    2820 m" without a page to pin it to. camptocamp waypoint 1310495 is
    "Cabane de la Tour Rouge" and carries an elevation field; fetch it.
  sources:
    - url: http://www.refuges.info/point/378/cabane-non-gardee/Ancien-Bivouac-de-la-Tour-Rouge/
      value: 2822
      retrieved: 2026-09-07
