# Source inventory for the Mont Blanc massif, v1.
#
# Each of these needs hands-on recon before its scraper is written. This is the
# starting point, not verified ground truth. `active: false` means "identified,
# not yet built".
#
# trust_weight drives status resolution: an arrêté outranks an Instagram post.

- slug: mairie-chamonix
  name: Mairie de Chamonix-Mont-Blanc — actes réglementaires
  url: https://www.chamonix.fr/la-commune/publications-municipales/deliberations/
  source_type: official
  language: fr
  country: FR
  trust_weight: 1.00
  fetch_interval_minutes: 1440
  active: false
  notes: >
    INVESTIGATED AND PARKED — not a productive source. Recorded so nobody
    spends another afternoon on it.

    Not chamonix-mont-blanc.fr, which is the tourist office. robots.txt is
    permissive; the site is WordPress and its REST API is open.

    The "decree" post type (Publicité des actes) exists but is EMPTY:
    /wp-json/wp/v2/decree returns X-WP-Total=0 and decree-sitemap1.xml lists
    zero URLs. Scaffolding with nothing published through it.

    The news feed (471 items, full JSON, real dates) carries no route
    closures. Server-side search across arrête/montagne/glacier/éboulement/
    interdiction and ten more terms surfaced 31 mountain-adjacent items in two
    years: parking closures, the swimming pool, town-hall counters, refuge
    concession tenders, a firework ban, cable maintenance, exhibitions. Zero
    alpine route closures, zero rockfall or glacier arrêtés, nothing on the
    Grand Couloir.

    No third-party acts portal either: the page's only outbound links are
    social media and the web agency. publication=municipal bulletin,
    report=council minutes, procedure=empty.

    Why: Saint-Gervais is unusual in owning and actively regulating the Goûter
    route. Chamonix has no equivalent role over alpine routes — its lifts are
    Compagnie du Mont-Blanc (covered by mbnr-live) and its high-mountain
    hazard information comes from the OHM/Chamoniarde, not the mairie.

    Re-check only if the decree register starts publishing. The recon module
    massif/ingest/sources/chamonix.py re-runs all of the above in one command.

- slug: mairie-saint-gervais
  name: Mairie de Saint-Gervais-les-Bains — actualités
  url: https://www.saintgervais.com/mairie/actualites/
  source_type: official
  language: fr
  country: FR
  trust_weight: 1.00
  fetch_interval_minutes: 360
  active: true
  notes: >
    Goûter route and Tête Rousse regulation — the most consequential publisher
    on this list for alpinists. Notices are plain HTML news posts, not PDFs,
    with dates in the title ("du 26 au 29 mai 2026", "le 26/08/26"), so no PDF
    extraction is needed. They sit undifferentiated in the general municipal
    feed alongside town news, so the scraper must decide what is a mountain
    notice: keyword gate, then rule-based date parsing on the title.

