# Community wiki for mountain shelters, France and the Pyrenees. CC BY-SA 2.0
# with a documented read-only API, which is why this is an API client and not a
# scraper. Their robots.txt is a long, fair complaint about bots consuming
# resources a volunteer pays for; we answer it by fetching the whole massif in
# one request a week, keeping only structured fields, and linking every hut
# back to the entry whose community wrote it.
#
# NOT a scraper: produces feature_facts, never statements. Capacity is a
# property of a building, not a claim in force over a window.
