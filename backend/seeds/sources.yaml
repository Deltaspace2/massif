- slug: mbnr-openings
  name: Mont-Blanc Natural Resort — seasonal opening calendar
  url: https://www.montblancnaturalresort.com/en/annual-openings
  source_type: operator
  language: en
  country: FR
  trust_weight: 0.90
  fetch_interval_minutes: 1440
  active: true
  notes: >
    Scheduled opening and closing dates per site for the season. A different
    statement type from live status: forward-looking, low-churn, and the thing
    that answers "will the Tramway be running in late September". Emits
    statements with valid_from/valid_to rather than a current status.
    Carries its own caveat that dates are indicative and subject to change —
    reproduce that caveat, do not launder it into certainty.

    DOES NOT COVER THE TRAMWAY DU MONT-BLANC, and this was checked rather than
    assumed. Both this page and infos-live contain the string "Tramway du
    Mont-Blanc" against the slug `tramway-montblanc`, which looks exactly like
    a row we are dropping. It is not: the only occurrence on either page is
    inside the RSC payload's `resort` translation dictionary, a table of
    display labels. There is no season row and no live row behind it. The
    Tramway therefore has no status from any source we carry, and would need
    one of its own.

- slug: skyway-monte-bianco
  name: Skyway Monte Bianco
  url: https://www.montebianco.com/
  source_type: operator
  language: it
  country: IT
  trust_weight: 0.95
  fetch_interval_minutes: 30
  active: false
  notes: >
    BLOCKED ON TLS, not unstarted. Recorded so nobody spends another afternoon
    on it. This is the operator of the only Italian lift we carry, so its
    absence is why Skyway has no status.

    Neither of their hostnames presents a chain a strict client can verify:

      www.montebianco.com   verify error 21, unable to verify the first
                            certificate — the leaf is a Sectigo DV cert whose
                            ISSUING INTERMEDIATE the server never sends. The
                            root is in certifi; the chain is simply incomplete.
                            Browsers paper over this by fetching the
                            intermediate from the AIA extension. httpx does not.
      skywaymontebianco.com verify error 18, self-signed.

    We do not turn verification off, and we do not pin their missing
    intermediate ourselves: an operator's TLS is theirs to fix, and a
    conditions site that quietly lowers its own standards to read one source
    has made a decision nobody reviewed. Same discipline as treating an
    unreachable robots.txt as a refusal.

    Re-check by running the diagnosis again; if `openssl s_client -connect
    www.montebianco.com:443` stops saying 21, this becomes a normal scraper.
    Until then the Italian lift carries directory data and no status, which is
    the honest state.

# The operator of fifteen of the huts inside this massif, publishing per hut the
# "Période de gardiennage": the dated window it is open to the public. The first
# source we carry that makes a dated claim about a HUT being open — refuges.info
# only ever says when one is shut, and says nothing at all about most of them.
#
# Weekly, because a season is published once in spring and then stands. The
# directory page decides which huts are in the massif; each refuge's own site
# carries the dates, and both are stored so an improved parser re-runs over
# them without re-fetching.
#
# Below Saint-Gervais (1.00) deliberately: the mairie shut the Goûter and Tête
# Rousse by arrêté on 11 August, in the middle of the season this source
# publishes. A season must never outrank a decree.
- slug: ffcam-refuges
  name: FFCAM — refuges gardés du massif du Mont-Blanc
  url: https://www.ffcam.fr/rechercher_refuge_chalet.html
  source_type: operator
  language: fr
  country: FR
  trust_weight: 0.90
  fetch_interval_minutes: 10080
  active: true
  notes: >
    Warden seasons for the FFCAM huts: Goûter, Tête Rousse, Grands Mulets,
    Couvercle, Argentière, Albert 1er, Conscrits, Durier, Leschaux, Envers des
    Aiguilles, Vallot, Chalet du Tour, Requin.

    Emits OPENING statements valid only inside the published window and
    synthesises NOTHING outside it. "Gardiennage" is the warden season, not the
    access season — most of these huts have a winter room and FFCAM sells
    "hors gardiennage" bookings for it — so the end of the season means
    unstaffed, never closed.

    Two page shapes, both in tests/fixtures: montblanc.ffcam.fr is one portal
    for three huts, every other refuge has its own site. Huts whose season is
    published as prose ("De début avril à fin septembre") emit nothing rather
    than a guessed year.

    Nid d'Aigle is excluded by name: FFCAM's own page says it no longer manages
    it. So is "TETE ROUSSE- CAMP DE BASE", the annexe listed 2 m from the
    refuge itself, which no altitude check could ever tell apart from it.

# The Tramway is Compagnie du Mont-Blanc's, but neither mbnr page publishes it
# — the `tramway-montblanc` slug on those pages is a display label whose link
# leaves the site for tramwaydumontblanc.fr, which is where the running periods
# actually are. Carried as its own source because the Tramway is the access for
# the Goûter route: its closure closes the normal approach.
#
# Weekly. A timetable is published once a season and then stands.
- slug: tmb-tramway
  name: Tramway du Mont-Blanc — running periods
  url: https://www.tramwaydumontblanc.fr/
  source_type: operator
  language: fr
  country: FR
  trust_weight: 0.90
  fetch_interval_minutes: 10080
  active: true
  notes: >
    WordPress; robots.txt disallows only /wp/wp-admin/. Use the www host — the
    apex has no reachable robots.txt, which we treat as a refusal.

    Reads `select.tmb-periode-select`, the operator's own element, rather than
    the Elementor tab headings that render the same strings. Both work today;
    one of them is about this railway and the other is about whoever laid the
    page out.

    Emits OPENING at status UNKNOWN, following mbnr-openings rather than
    ffcam-refuges. A timetable says when trains are scheduled, not that one is
    running, and this railway stops for weather. The statement still carries
    its dates, which is what feeds `season` — the availability question a trip
    planner asks.

    The operator does say they close for "contrainte technique ou
    météorologique", but only in the ticket-refund FAQ. That sentence is
    deliberately NOT reproduced as a caveat on the schedule: it is a refund
    condition, and presenting it as a service warning would put words in their
    mouth.

# Route conditions, from the `condition_rating` on dated trip reports.
#
# THIS SITS AGAINST CLAUDE.md's "Not in v1: crowd-sourced condition reports ...
# do not start them until v1 has run a full season". Built on an explicit
# instruction to get route status checked weekly, after the two in-scope
# alternatives were reconned and came up empty — La Chamoniarde publishes only
# other people's data, and the préfecture's mountain output is avalanche
# vigilance plus one access ban that lives in a PDF. Setting active: false here
# turns it off and nothing else has to change.
#
# NEVER PRODUCES A CLOSURE. Every statement is `condition` at status UNKNOWN,
# so a route's badge is untouched and only its notices gain a line. One
# person's report of a day out is not a closure, and "poor" is not "shut".
#
# Trust is the lowest we carry: a single report, not an operator or an
# authority. STALE_DAYS answers `condition` with 14 days, which is right — a
# report from three weeks ago describes a mountain that has since had weather.
- slug: camptocamp-outings
  name: camptocamp.org — route condition reports
  url: https://www.camptocamp.org/outings
  source_type: community
  language: fr
  trust_weight: 0.50
  fetch_interval_minutes: 10080
  active: true
  licence: CC BY-SA
  licence_url: https://creativecommons.org/licenses/by-sa/3.0/
  notes: >
    Reads only the structured `condition_rating` enum, the date and the title —
    never their prose, the same discipline as the facts importer. That is why
    this is a rule-based parser and needs no LLM.

    Routes are matched by a HAND-PINNED camptocamp id in features_curated.yaml,
    never by search. Matching by name put our Goûter route on the Kungsleden in
    Sweden via our own alias "Voie Royale"; with an altitude gate added, the
    Grand Couloir still matched an unrelated "Couloir Rectiligne", because
    altitude cannot separate two couloirs at the same height. Nine of thirteen
    routes are pinned. The other four had no unambiguous match and stay silent.

    Every statement carries the permalink to the outing whose author wrote it.
    CC BY-SA: the link back is a licence condition, per report, never one
    shared footer.

# The Swiss Alpine Club's booking platform. One endpoint on it needs no login
# and answers with 731 days of per-day hut status — SERVICED, UNSERVICED or
# CLOSED — which is a dated, structured season from the operator's own system.
#
# Three of our huts are on it: Trient, Orny, Saleinaz. Their ids come from the
# booking link on each hut's own website and were checked against the platform's
# public hutInfo before being written into features_curated.yaml. The other 35
# wardened huts in the massif use other booking systems or take bookings by
# telephone; adding one is a line in the seed, not a code change.
- slug: hut-reservation
  name: hut-reservation.org — CAS hut availability
  url: https://www.hut-reservation.org/
  source_type: operator
  language: en
  country: CH
  trust_weight: 0.95
  fetch_interval_minutes: 10080
  active: true
  notes: >
    Neither this host nor alpsonline.org serves a real robots.txt — both return
    the SPA's HTML for it, so no rules are declared and none are broken. Only
    the public availability and hutInfo endpoints are read; everything past hut
    metadata requires authentication and is left alone.

    CLOSED carries closure_kind "outside_hours". A Swiss hut is shut for most
    of the winter and that is the ordinary state of the world, not an incident
    — it renders grey rather than red.

# The huts' own websites, read by the model. The only LLM-backed source here,
# and the only one where rules were never an option: 37 wardened huts on 25
# unrelated websites with no ids, no shared platform and no structure.
#
# Measured before it was built. robots.txt: 23 of 25 hosts allow;
# refuge-lac-blanc.fr and rifugiogonella.com REFUSE and are not carried. Eight
# sites are JS-rendered and yield under 400 characters — Montenvers gives 115.
# Eleven of the fifteen readable ones are French; the four Italian ones arrive
# undated, because fr_dates cannot read Italian.
#
# Which huts are read at all is seeds/hut_sites.yaml, with a reason written
# beside every omission.
- slug: hut-sites
  name: Hut operators' own websites
  url: https://www.camptocamp.org/
  source_type: operator
  language: fr
  trust_weight: 0.60
  fetch_interval_minutes: 10080
  active: true
  notes: >
    Which hut a statement is about is RESOLVED, not assumed: the Cabane
    d'Orny's page carries a sentence about the Cabane de l'A Neuve, and pinning
    everything to the site's owner would file that closure on Orny. Only an
    unresolved mention — "la cabane", "le refuge" — falls back to the site's
    own hut.

    These pages state a recurring season without a year ("du 15 mars au 15
    octobre"), so read_document is given the document's year to bind them to
    and the statements carry `approximate`. The year is ours, not theirs.

    Everything is written needs_review: nothing here can take a status slot
    until a person clears it.

