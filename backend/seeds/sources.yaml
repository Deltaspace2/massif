# Source inventory for the Mont Blanc massif, v1.
#
# Each of these needs hands-on recon before its scraper is written. This is the
# starting point, not verified ground truth. `active: false` means "identified,
# not yet built".
#
# trust_weight drives status resolution: an arrêté outranks an Instagram post.

- slug: mairie-chamonix
  name: Mairie de Chamonix-Mont-Blanc — arrêtés municipaux
  url: https://www.chamonix-mont-blanc.fr/
  source_type: official
  language: fr
  country: FR
  trust_weight: 1.00
  fetch_interval_minutes: 360
  active: false
  notes: >
    Legally authoritative closures. PDFs, irregular publication schedule.
    Needs LLM extraction — a French legal notice naming which section of which
    path is closed between which dates is exactly what a regex cannot do.

