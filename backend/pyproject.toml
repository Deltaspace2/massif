[project]
name = "massif"
version = "0.1.0"
description = "Closure and status map for the Mont Blanc massif"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39"]
pdf = ["pypdfium2>=4.30"]
browser = ["playwright>=1.48"]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["massif*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
